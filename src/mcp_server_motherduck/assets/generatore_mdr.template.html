<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generatore MDR</title>
<style>
  :root { --bg:#ffffff; --text:#1d2330; --muted:#5d6677; --line:#e2e5eb; --accent:#1f5fae; --soft:#f4f6fa;
          --ok:#1e7a46; --ok-bg:#e5f4ec; --err:#b3261e; --err-bg:#fbe9e7; --wait:#8a5a00; --wait-bg:#fdf3dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c2027; --text:#e7eaf0; --muted:#9aa3b2; --line:#2c323c; --accent:#5b9bea; --soft:#252a33;
            --ok:#6fd39b; --ok-bg:#173325; --err:#ff8a80; --err-bg:#3a1b19; --wait:#f2c05c; --wait-bg:#3a2f14; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:14px; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:17px; margin:0 0 10px; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .tab { background:none; color:var(--muted); border:0; border-bottom:2px solid transparent; border-radius:0; padding:6px 12px; font-weight:600; }
  .tab.on { color:var(--accent); border-bottom-color:var(--accent); }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:10px 0 3px; }
  .filters input[type=text] { max-width:220px; }
  select { padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  input[type=text], input[type=date] { width:100%; max-width:320px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  .drop { border:2px dashed var(--line); border-radius:8px; padding:14px; text-align:center; color:var(--muted); cursor:pointer; background:var(--soft); }
  .drop.over { border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:7px 14px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  a.btn { display:inline-block; text-decoration:none; background:var(--accent); color:#fff; border-radius:6px; padding:7px 14px; font-size:13px; font-weight:600; }
  a.btn.sec { background:var(--soft); color:var(--text); border:1px solid var(--line); }
  a.btn.off { opacity:.5; pointer-events:none; }
  .prep { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; margin:6px 0 4px; }
  .spin { width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:rot .8s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }
  button.sec { background:var(--soft); color:var(--text); border:1px solid var(--line); }
  button.danger { background:var(--err-bg); color:var(--err); border:1px solid var(--err); }
  button[disabled] { opacity:.5; cursor:default; }
  .files { list-style:none; padding:0; margin:8px 0; }
  .files li { display:flex; gap:8px; align-items:center; padding:5px 8px; border:1px solid var(--line); border-radius:6px; margin-bottom:4px; font-size:13px; }
  .files .n { flex:1; word-break:break-all; } .files .s { color:var(--muted); font-size:12px; }
  .files .x { background:none; color:var(--muted); padding:0 6px; font-size:16px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .card.click { cursor:pointer; } .card.click:hover { border-color:var(--accent); }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .name { font-weight:600; flex:1; min-width:140px; }
  .st { font-size:12px; font-weight:600; padding:2px 9px; border-radius:999px; background:var(--wait-bg); color:var(--wait); }
  .st.succeeded { background:var(--ok-bg); color:var(--ok); } .st.failed { background:var(--err-bg); color:var(--err); }
  .st.cancelled { background:var(--soft); color:var(--muted); }
  .muted { color:var(--muted); font-size:12px; }
  .bar { height:8px; background:var(--soft); border-radius:99px; overflow:hidden; margin:8px 0 4px; border:1px solid var(--line); }
  .bar > i { display:block; height:100%; background:var(--accent); transition:width .4s; }
  .msg { padding:8px 10px; border-radius:6px; margin:10px 0; font-size:13px; background:var(--wait-bg); color:var(--wait); }
  .msg.err { background:var(--err-bg); color:var(--err); } .msg.ok { background:var(--ok-bg); color:var(--ok); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .sk { background:linear-gradient(90deg,var(--soft) 25%,var(--line) 50%,var(--soft) 75%); background-size:200% 100%; animation:sk 1.2s linear infinite; border-radius:6px; }
  @keyframes sk { from { background-position:200% 0; } to { background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce) { .sk { animation:none; } }
  .card .chk { margin-right:2px; width:16px; height:16px; accent-color:var(--accent); }
  .card.sel { border-color:var(--accent); background:var(--soft); }
  .bar2 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 10px; }
  .bar2 .sp { flex:1; }
  .hide { display:none; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:8px 0; font-size:13px; } dt { color:var(--muted); }
</style>
</head>
<body>
<h1>Generatore MDR</h1>
<div id="cfg"></div>
<div class="tabs">
  <button class="tab on" data-t="new">Nuova generazione</button>
  <button class="tab" data-t="list">Generazioni</button>
</div>

<section id="v-new">
  <label for="code">Codice progetto</label>
  <input type="text" id="code" maxlength="40" placeholder="es. 5890" autocomplete="off">
  <label for="sd">Data di inizio progetto (facoltativa)</label>
  <input type="date" id="sd">
  <label>Scope of Work (PDF)</label>
  <div class="drop" id="drop">Trascina qui i PDF oppure clicca per sceglierli<input type="file" id="file" accept="application/pdf,.pdf" multiple class="hide"></div>
  <ul class="files" id="files"></ul>
  <div class="actions"><button id="go" disabled>Avvia generazione</button></div>
  <div id="newmsg"></div>
</section>

<section id="v-list" class="hide">
  <div class="bar2">
    <button class="sec" id="refresh">Aggiorna</button>
    <button class="sec" id="selmode">Elimina</button>
    <span class="sp"></span>
    <button class="sec hide" id="selall">Seleziona tutte</button>
    <button class="danger hide" id="delsel" disabled>Elimina</button>
  </div>
  <div class="bar2 filters">
    <input type="text" id="fq" maxlength="40" placeholder="Cerca codice progetto" aria-label="Cerca codice progetto" autocomplete="off">
    <select id="fs" aria-label="Filtra per stato">
      <option value="">Tutti gli stati</option><option value="active">In corso</option><option value="succeeded">Completati</option>
      <option value="failed">In errore</option><option value="cancelled">Annullati</option>
    </select>
    <button class="sec hide" id="fclear">Azzera filtri</button>
  </div>
  <div id="list"></div>
  <div id="meta" class="muted" style="margin-top:8px"></div>
</section>

<section id="v-det" class="hide">
  <div class="actions"><button class="sec" id="back">← Torna all'elenco</button></div>
  <div id="det"></div>
</section>

<script>/*__MCP_APPS_SDK__*/</script>
<script>
(function () {
  var MAXF = 32, MAXT = 100;
  var files = [], busy = false, curJob = null, timer = null, seeded = false, seedUsed = false, cfgError = false;
  var $ = function (id) { return document.getElementById(id); };
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; }
  function mb(n) { return (n / 1048576).toFixed(1) + " MB"; }
  function parse(res) {
    if (res && res.structuredContent) return res.structuredContent;
    var t = ((res && res.content) || []).filter(function (c) { return c.type === "text"; }).map(function (c) { return c.text; }).join(" ");
    try { return JSON.parse(t); } catch (e) { return null; }
  }
  function errText(res) {
    var t = ((res && res.content) || []).map(function (c) { return c.text || ""; }).join(" ").trim();
    return t || "Operazione non riuscita.";
  }

  var sdk = window.__mcpApps;
  if (!sdk || !sdk.App) { document.body.textContent = "Il pannello non si è caricato correttamente."; return; }
  var app = new sdk.App({ name: "Generatore MDR", version: "1.0.0" }, {});
  function call(name, args) {
    return app.callServerTool({ name: name, arguments: args || {} }).then(function (res) {
      if (res && res.isError) throw new Error(errText(res));
      return parse(res) || {};
    });
  }
  function say(box, text, kind) { box.textContent = ""; if (text) { var m = el("div", "msg " + (kind || ""), text); box.appendChild(m); } }

  // ---- schede
  function show(tab) {
    ["new", "list", "det"].forEach(function (t) { $("v-" + t).classList.toggle("hide", t !== tab); });
    document.querySelectorAll(".tab").forEach(function (b) { b.classList.toggle("on", b.dataset.t === (tab === "det" ? "list" : tab)); });
    clearTimeout(timer);
    if (tab !== "list") { selecting = false; picked = {}; }
    if (tab === "list") loadList(false);
    if (tab === "det") pollDet();
  }
  document.querySelectorAll(".tab").forEach(function (b) { b.onclick = function () { show(b.dataset.t); }; });

  // ---- nuova generazione
  function renderFiles() {
    var ul = $("files"); ul.textContent = "";
    files.forEach(function (f, i) {
      var li = el("li"); li.appendChild(el("span", "n", f.name)); li.appendChild(el("span", "s", mb(f.size)));
      var x = el("button", "x", "×"); x.title = "Rimuovi"; x.onclick = function () { if (!busy) { files.splice(i, 1); renderFiles(); } };
      li.appendChild(x); ul.appendChild(li);
    });
    $("go").disabled = cfgError || busy || !files.length || !$("code").value.trim();
  }
  function addFiles(list) {
    var msgs = [];
    Array.prototype.forEach.call(list, function (f) {
      if (!/\.pdf$/i.test(f.name)) { msgs.push("'" + f.name + "' non è un PDF."); return; }
      if (f.size > MAXF * 1048576) { msgs.push("'" + f.name + "' supera " + MAXF + " MB."); return; }
      if (files.some(function (g) { return g.name === f.name && g.size === f.size; })) return;
      files.push(f);
    });
    var tot = files.reduce(function (a, f) { return a + f.size; }, 0);
    if (tot > MAXT * 1048576) { msgs.push("Totale oltre " + MAXT + " MB."); }
    say($("newmsg"), msgs.join(" "), msgs.length ? "err" : "");
    renderFiles();
  }
  $("drop").onclick = function () { $("file").click(); };
  $("file").onchange = function () { addFiles(this.files); this.value = ""; };
  $("drop").ondragover = function (e) { e.preventDefault(); this.classList.add("over"); };
  $("drop").ondragleave = function () { this.classList.remove("over"); };
  $("drop").ondrop = function (e) { e.preventDefault(); this.classList.remove("over"); addFiles(e.dataTransfer.files); };
  $("code").oninput = renderFiles;

  function put(url, file) {
    return fetch(url, { method: "PUT", headers: { "Content-Type": "application/pdf" }, body: file }).then(function (r) {
      if (!r.ok) throw new Error("Caricamento di '" + file.name + "' non riuscito (" + r.status + ").");
    });
  }
  $("go").onclick = function () {
    if (busy) return;
    busy = true; renderFiles();
    var box = $("newmsg"), job = null;
    say(box, "Preparo il caricamento…");
    call("mdr_prepara_upload", {
      project_code: $("code").value.trim(), start_date: $("sd").value || "",
      files: files.map(function (f) { return { name: f.name, size: f.size }; })
    }).then(function (p) {
      job = p.job_id;
      var n = 0;
      return Promise.all(p.uploads.map(function (u, i) {
        return put(u.url, files[i]).then(function () { n++; say(box, "Caricati " + n + " di " + files.length + " PDF…"); });
      }));
    }).then(function () {
      say(box, "Avvio la generazione…");
      return call("mdr_avvia", { job_id: job });
    }).then(function (run) {
      files = []; busy = false; renderFiles(); say(box, "");
      runs[run.job_id] = run; if (cache) { cache.runs.unshift(run); cache.at = 0; }
      curJob = run.job_id; show("det");
    }).catch(function (e) {
      busy = false; renderFiles(); say(box, String(e.message || e), "err");
    });
  };

  // ---- elenco
  function badge(run) { return el("span", "st " + run.state, run.state_label); }
  function skel(w, h) { var d = el("div", "sk"); d.style.width = w; d.style.height = h; return d; }
  function skelList(box) {
    box.textContent = "";
    for (var i = 0; i < 4; i++) {
      var c = el("div", "card"), row = el("div", "row");
      row.appendChild(skel("45%", "16px")); row.appendChild(skel("70px", "20px")); c.appendChild(row);
      var m = skel("30%", "12px"); m.style.marginTop = "8px"; c.appendChild(m); box.appendChild(c);
    }
  }
  function skelDet(box) {
    box.textContent = "";
    var row = el("div", "row"); row.appendChild(skel("45%", "18px")); row.appendChild(skel("80px", "20px")); box.appendChild(row);
    var bar = skel("100%", "8px"); bar.style.margin = "10px 0"; box.appendChild(bar);
    for (var i = 0; i < 4; i++) { var l = skel(60 + i * 8 + "%", "12px"); l.style.marginBottom = "8px"; box.appendChild(l); }
    var act = el("div", "actions"); act.appendChild(skel("110px", "30px")); act.appendChild(skel("150px", "30px")); act.appendChild(skel("60px", "30px")); box.appendChild(act);
  }
  var runs = {}, currentRuns = [], currentMore = false, fq = "", fs = "", flimit = 10, loadTok = 0;
  var selecting = false, picked = {};
  function pickedIds() { return Object.keys(picked).filter(function (k) { return picked[k]; }); }
  function updateSel() {
    var n = pickedIds().length, btn = $("delsel");
    btn.disabled = n === 0; btn.textContent = n ? "Elimina (" + n + ")" : "Elimina";
    delete btn.dataset.sure; btn.className = "danger" + (selecting ? "" : " hide");
    $("selmode").textContent = selecting ? "Annulla" : "Elimina";
    $("selall").classList.toggle("hide", !selecting);
    btn.classList.toggle("hide", !selecting);
    document.querySelectorAll("#list .card").forEach(function (c) {
      var on = !!picked[c.dataset.job]; c.classList.toggle("sel", on);
      var k = c.querySelector(".chk"); if (k) k.checked = on;
    });
  }
  function renderList(d) {
    currentRuns = d.runs; currentMore = d.altri;
    var box = $("list"); box.textContent = "";
    if (!d.runs.length) { box.appendChild(el("p", "muted", fq || fs ? "Nessuna generazione corrisponde ai filtri." : "Nessuna generazione.")); updateSel(); return; }
    d.runs.forEach(function (r) {
      runs[r.job_id] = r;
      var c = el("div", "card click"), row = el("div", "row"); c.dataset.job = r.job_id;
      if (selecting) {
        var k = el("input", "chk"); k.type = "checkbox"; k.disabled = r.active; k.title = r.active ? "In corso: annullala prima" : "";
        k.onclick = function (e) { e.stopPropagation(); picked[r.job_id] = k.checked; updateSel(); };
        row.appendChild(k);
      }
      row.appendChild(el("span", "name", "Progetto " + r.project_code)); row.appendChild(badge(r)); c.appendChild(row);
      c.appendChild(el("div", "muted", r.created_label + (r.active ? " · " + (r.step_label || "") : "")));
      c.onclick = function () {
        if (selecting) { if (!r.active) { picked[r.job_id] = !picked[r.job_id]; updateSel(); } return; }
        curJob = r.job_id; show("det");
      };
      box.appendChild(c);
    });
    if (d.altri) {
      var more = el("button", "sec", flimit >= 50 ? "Ce ne sono altre: affina i filtri" : "Mostra altre"); more.disabled = flimit >= 50;
      more.onclick = function () { flimit = Math.min(flimit + 10, 50); drawList(); };
      box.appendChild(more);
    }
    updateSel();
  }
  $("selmode").onclick = function () { selecting = !selecting; picked = {}; renderList({ runs: currentRuns, altri: currentMore }); };
  $("selall").onclick = function () { currentRuns.forEach(function (r) { if (!r.active) picked[r.job_id] = true; }); updateSel(); };
  function confirmDelete(btn, ids, label, done) {
    if (!btn.dataset.sure) {
      btn.dataset.sure = "1"; btn.textContent = "Conferma: elimina anche i file dal bucket";
      setTimeout(function () { if (btn.isConnected && btn.dataset.sure) { delete btn.dataset.sure; btn.textContent = label(); } }, 6000);
      return;
    }
    btn.disabled = true; btn.textContent = "Elimino…";
    call("mdr_elimina", { job_ids: ids }).then(function (res) {
      ids.forEach(function (id) { if (res.eliminati.indexOf(id) >= 0) { delete runs[id]; delete picked[id]; } });
      done(res);
    }).catch(function (e) { btn.disabled = false; delete btn.dataset.sure; btn.textContent = label(); say($("detmsg") || $("list"), String(e.message || e), "err"); });
  }
  $("delsel").onclick = function () {
    confirmDelete(this, pickedIds(), function () { var n = pickedIds().length; return n ? "Elimina (" + n + ")" : "Elimina"; }, function (res) {
      selecting = false; picked = {};
      if (cache) cache.runs = cache.runs.filter(function (r) { return res.eliminati.indexOf(r.job_id) < 0; });
      drawList(); refresh();
      if (res.saltati.length) setTimeout(function () { say($("list"), res.saltati.length + " generazioni non eliminate (in corso).", ""); }, 0);
    });
  };
  // Elenco in memoria: i filtri lavorano sui dati già scaricati (nessuna attesa); il server si interroga solo per aggiornare.
  var cache = null, loadTok = 0, refreshing = false;
  function matches(r) {
    var q = fq.toLowerCase();
    if (q && String(r.project_code || "").toLowerCase().indexOf(q) < 0) return false;
    if (fs === "active") return !!r.active;
    return !fs || r.state === fs;
  }
  function drawList() {
    if (!cache) return;
    var all = cache.runs.filter(matches), shown = all.slice(0, flimit);
    renderList({ runs: shown, altri: all.length > shown.length });
    var t = new Date(cache.at), hh = ("0" + t.getHours()).slice(-2) + ":" + ("0" + t.getMinutes()).slice(-2);
    $("meta").textContent = (refreshing ? "Aggiorno… · " : "") + "Aggiornato alle " + hh;
  }
  function refresh() {
    if (refreshing) return;
    refreshing = true; $("refresh").disabled = true; $("refresh").textContent = "Aggiorno…";
    var t0 = Date.now();
    call("mdr_elenco", { limit: 50 }).then(function (d) {
      cache = { runs: d.runs, complete: !d.altri, at: Date.now(), total: Date.now() - t0, server: d.ms };
    }).catch(function (e) {
      if (!cache) say($("list"), String(e.message || e), "err"); else $("meta").textContent = "Aggiornamento non riuscito: " + String(e.message || e);
    }).then(function () {
      refreshing = false; $("refresh").disabled = false; $("refresh").textContent = "Aggiorna";
      if (cache && !$("v-list").classList.contains("hide")) drawList();
    });
  }
  function loadList(force) {
    if (!cache) { skelList($("list")); refresh(); return; }
    drawList();
    if (force || Date.now() - cache.at > 30000) refresh();
  }
  var ftimer = null;
  function filtersChanged() {
    fq = $("fq").value.trim(); fs = $("fs").value; flimit = 10; picked = {};
    $("fclear").classList.toggle("hide", !(fq || fs));
    drawList();
  }
  $("fq").oninput = filtersChanged;
  $("fq").onkeydown = function (e) { if (e.key === "Enter") { clearTimeout(ftimer); filtersChanged(); } };
  $("fs").onchange = filtersChanged;
  $("fclear").onclick = function () { $("fq").value = ""; $("fs").value = ""; filtersChanged(); };
  $("refresh").onclick = function () { loadList(true); };
  $("back").onclick = function () { show("list"); };

  // ---- dettaglio
  function dl(label, value) { var f = document.createDocumentFragment(); f.appendChild(el("dt", "", label)); f.appendChild(el("dd", "", value)); f.lastChild.style.margin = 0; return f; }
  var links = null, linksAt = 0, linksJob = null, linksKey = "";
  function fetchLinks(job) {
    return call("mdr_links", { job_id: job }).then(function (l) { if (job === curJob) { links = l; linksAt = Date.now(); } return l; });
  }
  function linkFor(kind, name) { return links ? (kind === "sow" ? links.sow && links.sow[name] : links[kind]) : null; }
  // Il link è già pronto: il clic apre subito il file, senza attese (il browser blocca le aperture ritardate).
  function makeLink(label, kind, name, cls) {
    var a = el("a", "btn " + (cls || "") + " off", label); a.target = "_blank"; a.rel = "noopener";
    a.dataset.kind = kind; a.dataset.name = name || "";
    a.onclick = function (e) {
      var l = linkFor(kind, name);
      if (!l) { e.preventDefault(); return; }
      if (Date.now() - linksAt > 9 * 60 * 1000) { // link quasi scaduto: si rinnova e si riprova al clic successivo
        e.preventDefault(); a.classList.add("off"); fetchLinks(curJob).then(function () { a.classList.remove("off"); a.href = linkFor(kind, name).url; say($("detmsg"), "Link rinnovato: premi di nuovo.", "ok"); });
        return;
      }
      e.preventDefault();
      app.openLink({ url: l.url }).then(function (r) {
        if (r && r.isError) throw new Error("rifiutato");
      }).catch(function () {
        var w = null; try { w = window.open(l.url, "_blank", "noopener"); } catch (x) {}
        if (!w) showUrl(l);
      });
    };
    return a;
  }
  function showUrl(l) {
    var box = $("detmsg"); box.textContent = "";
    var m = el("div", "msg", "La chat non ha aperto il file. Copia questo indirizzo e incollalo in una nuova scheda: ");
    var inp = el("input"); inp.type = "text"; inp.readOnly = true; inp.value = l.url; inp.style.cssText = "width:100%;max-width:100%;margin-top:6px";
    inp.onfocus = function () { inp.select(); };
    m.appendChild(inp); box.appendChild(m);
  }
  function armLinks() {
    document.querySelectorAll("#det a.btn").forEach(function (a) {
      var l = linkFor(a.dataset.kind, a.dataset.name);
      if (l) { a.href = l.url; a.classList.remove("off"); }
    });
  }
  function drawDet(r, loading) {
    var box = $("det"); box.textContent = "";
    var row = el("div", "row"); row.appendChild(el("span", "name", "Progetto " + r.project_code)); row.appendChild(badge(r)); box.appendChild(row);
    if (r.active || r.state === "succeeded") {
      var bar = el("div", "bar"), i = el("i"); i.style.width = r.progress + "%"; bar.appendChild(i); box.appendChild(bar);
      box.appendChild(el("div", "muted", (r.step_label || "") + " · " + r.progress + "%"));
    }
    var d = el("dl");
    d.appendChild(dl("Avviata", r.created_label || "-"));
    if (r.finished_label) d.appendChild(dl("Terminata", r.finished_label));
    if (r.start_label) d.appendChild(dl("Inizio progetto", r.start_label));
    if (r.sow_files.length) d.appendChild(dl("SoW", r.sow_files.join(", ")));
    if (r.summary && typeof r.summary === "object") Object.keys(r.summary).forEach(function (k) {
      var v = r.summary[k]; if (v !== null && typeof v !== "object") d.appendChild(dl(k.replace(/_/g, " "), String(v)));
    });
    box.appendChild(d);
    if (r.error) box.appendChild(el("div", "msg err", r.error));
    var key = curJob + "|" + (r.has_mdr ? 1 : 0) + "|" + (r.active ? 1 : 0);
    var need = !links || linksJob !== curJob || linksKey !== key || Date.now() - linksAt > 9 * 60 * 1000;
    if (loading || need) { // scheda non pronta: niente pulsanti, solo segnaposto e indicatore
      var pr = el("div", "prep"); pr.appendChild(el("span", "spin")); pr.appendChild(el("span", "", loading ? "Carico la scheda…" : "Preparo i pulsanti…")); box.appendChild(pr);
      var sk = el("div", "actions"); sk.appendChild(skel("110px", "30px")); sk.appendChild(skel("70px", "30px")); sk.appendChild(skel("150px", "30px")); box.appendChild(sk);
      var dm = el("div"); dm.id = "detmsg"; box.appendChild(dm);
      if (!loading) {
        linksJob = curJob; linksKey = key;
        var jb = curJob;
        fetchLinks(jb).then(function () { if (jb === curJob && !$("v-det").classList.contains("hide")) drawDet(runs[jb] || r); })
          .catch(function (e) {
            linksKey = ""; if (jb !== curJob) return;
            var m2 = $("detmsg"); m2.textContent = ""; var er = el("div", "msg err", String(e.message || e) + " ");
            var rb = el("button", "sec", "Riprova"); rb.onclick = function () { drawDet(runs[jb] || r); }; er.appendChild(rb); m2.appendChild(er);
          });
      }
      return;
    }
    var a = el("div", "actions");
    if (r.has_mdr) a.appendChild(makeLink("Scarica MDR", "mdr", "", ""));
    if (!r.active) a.appendChild(makeLink("Log", "log", "", "sec"));
    r.sow_files.forEach(function (n) { a.appendChild(makeLink("SoW: " + n, "sow", n, "sec")); });
    if (!r.active && r.sow_files.length) {
      var br = el("button", "sec", "Rilancia con gli stessi file");
      br.onclick = function () {
        if (!br.dataset.sure) { // secondo clic per confermare: ogni generazione consuma crediti dei modelli
          br.dataset.sure = "1"; br.textContent = "Conferma: avvia una nuova generazione"; br.className = "danger";
          setTimeout(function () { if (br.isConnected) { delete br.dataset.sure; br.textContent = "Rilancia con gli stessi file"; br.className = "sec"; } }, 6000);
          return;
        }
        br.disabled = true; br.textContent = "Avvio…";
        call("mdr_rilancia", { job_id: curJob }).then(function (n) {
          runs[n.job_id] = n; if (cache) { cache.runs.unshift(n); cache.at = 0; } curJob = n.job_id; links = null; show("det");
        }).catch(function (e) { br.disabled = false; br.textContent = "Rilancia con gli stessi file"; br.className = "sec"; delete br.dataset.sure; say($("detmsg"), String(e.message || e), "err"); });
      }; a.appendChild(br);
    }
    if (!r.active) {
      var bd = el("button", "danger", "Elimina");
      bd.onclick = function () {
        confirmDelete(bd, [r.job_id], function () { return "Elimina"; }, function (res) { if (cache) cache.runs = cache.runs.filter(function (r) { return res.eliminati.indexOf(r.job_id) < 0; }); show("list"); });
      }; a.appendChild(bd);
    }
    if (r.active) {
      var bc = el("button", "danger", "Annulla"); bc.onclick = function () {
        bc.disabled = true;
        call("mdr_annulla", { job_id: curJob }).then(drawDet).catch(function (e) { say($("detmsg"), String(e.message || e), "err"); bc.disabled = false; });
      }; a.appendChild(bc);
    }
    box.appendChild(a);
    var m = el("div"); m.id = "detmsg"; box.appendChild(m);
    armLinks();
  }
  function pollDet(again) {
    clearTimeout(timer);
    var job = curJob;
    if (!again) { if (runs[job]) drawDet(runs[job], true); else skelDet($("det")); } // subito i dati già noti, poi l'aggiornamento
    call("mdr_dettaglio", { job_id: job }).then(function (r) {
      if (job !== curJob || $("v-det").classList.contains("hide")) return;
      runs[r.job_id] = r;
      drawDet(r);
      if (r.active) timer = setTimeout(function () { pollDet(true); }, 5000);
    }).catch(function (e) { say($("det"), String(e.message || e), "err"); });
  }

  app.ontoolresult = function (p) {
    var d = parse(p);
    if (d && d.errore) { say($("cfg"), d.errore, "err"); cfgError = true; renderFiles(); }
    if (d && d.max_file_mb) { MAXF = d.max_file_mb; MAXT = d.max_upload_mb || MAXT; }
    if (d && d.runs && d.runs.length) { cache = { runs: d.runs, complete: !d.altri, at: Date.now(), total: 0, server: null }; show("list"); if (d.altri) refresh(); }
  };
  app.connect && app.connect();
  renderFiles();
})();
</script>
</body>
</html>
