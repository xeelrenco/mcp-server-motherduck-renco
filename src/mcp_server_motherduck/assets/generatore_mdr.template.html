<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generatore MDR</title>
<style>
  :root { --bg:#ffffff; --text:#1d2330; --muted:#5d6677; --line:#e2e5eb; --accent:#1f5fae; --soft:#f4f6fa;
          --ok:#1e7a46; --ok-bg:#e5f4ec; --err:#b3261e; --err-bg:#fbe9e7; --wait:#8a5a00; --wait-bg:#fdf3dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c2027; --text:#e7eaf0; --muted:#9aa3b2; --line:#2c323c; --accent:#5b9bea; --soft:#252a33;
            --ok:#6fd39b; --ok-bg:#173325; --err:#ff8a80; --err-bg:#3a1b19; --wait:#f2c05c; --wait-bg:#3a2f14; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:14px; min-height:540px; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .top { display:flex; align-items:center; gap:10px; margin:0 0 10px; }
  h1 { font-size:17px; margin:0; flex:1; }
  #zoom { padding:6px 8px; line-height:0; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .tab { background:none; color:var(--muted); border:0; border-bottom:2px solid transparent; border-radius:0; padding:6px 12px; font-weight:600; }
  .tab.on { color:var(--accent); border-bottom-color:var(--accent); }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:10px 0 3px; }
  .filters input[type=text] { max-width:220px; }
  select { padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  input[type=text], input[type=date] { width:100%; max-width:320px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  .drop { border:2px dashed var(--line); border-radius:8px; padding:14px; text-align:center; color:var(--muted); cursor:pointer; background:var(--soft); }
  .drop.over { border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:7px 14px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  a.btn { display:inline-block; text-decoration:none; background:var(--accent); color:#fff; border-radius:6px; padding:7px 14px; font-size:13px; font-weight:600; }
  a.btn.sec { background:var(--soft); color:var(--text); border:1px solid var(--line); }
  a.btn.off { opacity:.5; pointer-events:none; }
  a.btn.ico { padding:6px 8px; line-height:0; }
  a.btn.lnk { background:none; border:0; color:var(--muted); font-size:12px; font-weight:500; padding:2px 4px; display:inline-flex; align-items:center; gap:5px; line-height:1.2; } a.btn.lnk:hover { color:var(--text); text-decoration:underline; }
  .inp { margin:14px 0 0; } .inp h4 { font-size:11px; margin:0 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .inp .fr { display:flex; align-items:center; gap:8px; padding:6px 6px 6px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:4px; font-size:13px; }
  .inp .fr > svg { flex:none; color:var(--muted); } .inp .fr .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tech { margin-top:10px; text-align:right; }
  .crumb { margin:2px 0 8px; } button.lnkb { background:none; border:0; color:var(--muted); padding:4px 8px 4px 0; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:3px; cursor:pointer; } button.lnkb:hover { color:var(--accent); }
  .facts { display:flex; flex-wrap:wrap; gap:8px 28px; margin:12px 0 2px; padding:10px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); } details .facts { margin:8px 0 6px; padding:6px 0 10px; border-top:0; }
  .facts .fa span { display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; } .facts .fa b { display:block; font-size:14px; margin-top:1px; font-variant-numeric:tabular-nums; }
  .rng { position:relative; height:2px; margin:9px 4px 4px; background:var(--line); border-radius:2px; } .rng i { position:absolute; left:-4px; right:-4px; top:-3px; height:8px; background:linear-gradient(var(--c2),var(--c2)) center/100% 2px no-repeat; }
  .rng:before, .rng:after { content:""; position:absolute; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--c2); } .rng:before { left:-4px; } .rng:after { right:-4px; }
  .re { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:3px; text-transform:capitalize; }
  .files .tag { font-size:11px; color:var(--c2); background:var(--soft); border:1px solid var(--line); border-radius:99px; padding:1px 8px; white-space:nowrap; }
  .rl { display:flex; flex-direction:column; gap:5px; max-width:340px; } .rl button { align-self:flex-start; } .rl .hint { font-size:12px; color:var(--muted); line-height:1.35; }
  .prep { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; margin:6px 0 4px; }
  .spin { width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:rot .8s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }
  button.sec { background:var(--soft); color:var(--text); border:1px solid var(--line); }
  button.danger { background:#c62828; color:#fff; border:1px solid #c62828; }
  button.danger:hover:not(:disabled) { background:#a81f1f; border-color:#a81f1f; }
  button[disabled] { opacity:.5; cursor:default; }
  .files { list-style:none; padding:0; margin:8px 0; }
  .files li { display:flex; gap:8px; align-items:center; padding:5px 8px; border:1px solid var(--line); border-radius:6px; margin-bottom:4px; font-size:13px; }
  .files .n { flex:1; word-break:break-all; } .files .s { color:var(--muted); font-size:12px; }
  .files .x { background:none; color:var(--muted); padding:0 6px; font-size:16px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .card.click { cursor:pointer; } .card.click:hover { border-color:var(--accent); }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .name { font-weight:600; flex:1; min-width:140px; }
  .st { font-size:12px; font-weight:600; padding:2px 9px; border-radius:999px; background:var(--wait-bg); color:var(--wait); }
  .st.succeeded { background:var(--ok-bg); color:var(--ok); } .st.failed { background:var(--err-bg); color:var(--err); }
  .st.cancelled { background:var(--soft); color:var(--muted); }
  .muted { color:var(--muted); font-size:12px; }
  .dp { position:relative; display:flex; gap:6px; align-items:center; }
  .dp button { padding:6px 9px; line-height:0; }
  .cwrap { position:relative; }
  .cal { position:absolute; top:-6px; left:calc(100% + 8px); z-index:40; width:240px; padding:8px 10px; background:var(--bg); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.22); }
  .cal.below { top:calc(100% + 6px); left:-156px; }
  .cal .h { display:flex; align-items:center; gap:4px; margin-bottom:4px; } .cal .h b { flex:1; text-align:center; font-size:13px; text-transform:capitalize; }
  .cal .h button { width:26px; height:26px; padding:0; border-radius:50%; font-size:16px; line-height:1; background:none; border:0; color:var(--muted); }
  .cal .h button:hover { background:var(--soft); color:var(--text); }
  .cal .g { display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:26px; gap:1px; text-align:center; align-items:center; }
  .cal .g .w { font-size:10px; font-weight:600; color:var(--muted); text-transform:uppercase; }
  .cal .g button { width:26px; height:26px; margin:0 auto; padding:0; background:none; color:var(--text); font-size:12px; font-weight:500; border:0; border-radius:50%; }
  .cal .g button:hover { background:var(--soft); }
  .cal .g button.out { color:var(--muted); opacity:.45; } .cal .g button.we { color:var(--muted); }
  .cal .g button.today { box-shadow:inset 0 0 0 1.5px var(--accent); color:var(--accent); font-weight:700; }
  .cal .g button.sel { background:var(--accent); color:#fff; box-shadow:none; font-weight:700; opacity:1; }
  body { position:relative; }
  #pv { height:600px; background:var(--bg); display:flex; flex-direction:column; border:1px solid var(--line); border-radius:8px; overflow:hidden; } /* bassa: la pagina non si allunga */
  body.pvopen > *:not(#pv) { display:none !important; }
  body.fsm #pv { height:calc(100vh - 30px); }
  #pv .ph { display:flex; align-items:center; gap:8px; padding:9px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #pv .tt { flex:1; min-width:140px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #pv .pn { display:flex; align-items:center; gap:5px; font-size:13px; color:var(--muted); }
  #pv .pn input { width:52px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; text-align:center; }
  #pv .ph button { padding:4px 10px; min-width:32px; }
  #pv .pb { position:relative; flex:1; overflow:auto; background:var(--soft); padding:12px; outline:0; }
  #pv .pg { margin:0 auto 12px; background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.28); position:relative; }
  #pv .pg canvas { display:block; width:100%; height:100%; }
  #pv .pm { padding:30px 10px; text-align:center; color:var(--muted); }
  button.ico { padding:6px 8px; line-height:0; }
  .nw { display:flex; align-items:center; gap:8px; min-width:0; } .nw button { flex:none; padding:4px 6px; }
  :root { --c2:#0f8b8d; }
  @media (prefers-color-scheme: dark) { :root { --c2:#3fc1c3; } }
  .dg { margin:10px 0 2px; }
  .dgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:4px 22px; align-items:start; }
  .kpi { display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:6px; margin:0 0 2px; }
  .kpi .k { border:1px solid var(--line); border-radius:10px; padding:6px 10px; background:var(--soft); }
  .kpi .k b { display:block; font-size:18px; line-height:1.15; font-variant-numeric:tabular-nums; }
  .kpi .k span { display:block; font-size:11px; color:var(--muted); line-height:1.25; margin-top:1px; }
  .dg h4 { font-size:11px; margin:10px 0 4px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .dbar { display:grid; grid-template-columns:minmax(80px,140px) 1fr 62px; gap:10px; align-items:center; padding:1px 0; font-size:12px; }
  .dbar .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dbar .tr { height:10px; border-radius:99px; background:var(--soft); border:1px solid var(--line); overflow:hidden; } .dbar .tr i { display:block; height:100%; background:var(--accent); border-radius:99px; }
  .dbar .nn { text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }
  .hist { display:flex; align-items:flex-end; gap:4px; padding-top:4px; }
  .hist .c { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
  .hist .c i { flex:none; display:block; width:100%; background:var(--c2); border-radius:4px 4px 2px 2px; opacity:.8; min-height:3px; } .hist .c.pk i { opacity:1; }
  .hist .v { font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; margin-bottom:2px; }
  .hist .m { font-size:10px; color:var(--muted); margin-top:3px; height:22px; text-transform:uppercase; line-height:1.15; text-align:center; } .hist .m u { display:block; text-decoration:none; opacity:.7; }
  /* ore uomo: palette categorica condivisa tra barre e grafico settimanale */
  :root { --p0:#2f6fb5; --p1:#e08a2c; --p2:#2f9e77; --p3:#b24a9a; --p4:#d1495b; --p5:#7a6bd1; --p6:#3a9fbf; --p7:#9aa0ab; }
  @media (prefers-color-scheme: dark) { :root { --p0:#5b9bea; --p1:#f0a24d; --p2:#4cc096; --p3:#d377bd; --p4:#ee7585; --p5:#9d90ee; --p6:#5cc0dd; --p7:#7b8393; } }
  .dbar.hr { grid-template-columns:minmax(80px,170px) 1fr 92px; } .dbar.hr .nm { display:flex; align-items:center; gap:7px; } .dbar.hr .nm:before { content:""; flex:none; width:8px; height:8px; border-radius:2px; background:var(--pc); }
  .dbar.hr .tr i { background:var(--pc); }
  .wkc { margin-top:2px; } .wkc svg { display:block; width:100%; height:auto; overflow:visible; }
  .wkc .gl { stroke:var(--line); stroke-width:1; } .wkc .ax { fill:var(--muted); font-size:10px; font-variant-numeric:tabular-nums; }
  .wkc .wk rect.b { transition:opacity .12s; } .wkc svg:hover .wk:not(:hover) rect.b { opacity:.45; } .wkc .wk rect.h { fill:transparent; }
  .dg .sub { font-weight:400; text-transform:none; letter-spacing:0; opacity:.85; }
  .dg .foot { margin-top:8px; font-size:12px; color:var(--muted); }
  .tl { list-style:none; margin:6px 0 4px; padding:0; }
  .tl li { position:relative; display:flex; align-items:center; gap:8px; padding:3px 0 3px 26px; font-size:13px; color:var(--muted); }
  .tl li::before { content:""; position:absolute; left:6px; top:0; bottom:0; width:2px; background:var(--line); }
  .tl li:first-child::before { top:50%; } .tl li:last-child::before { bottom:50%; }
  .tl .dot { position:absolute; left:0; top:50%; width:14px; height:14px; margin-top:-7px; border-radius:50%; background:var(--bg); border:2px solid var(--line); box-sizing:border-box; display:flex; align-items:center; justify-content:center; font-size:9px; line-height:1; font-weight:800; color:#fff; z-index:1; }
  .tl li.done { color:var(--text); } .tl li.done .dot { background:var(--ok); border-color:var(--ok); } .tl li.done .dot::after { content:"\2713"; }
  .tl li.current { color:var(--text); font-weight:600; } .tl li.current .dot { border-color:var(--accent); background:var(--accent); animation:tlp 1.4s ease-out infinite; }
  .tl li.failed { color:var(--err); font-weight:600; } .tl li.failed .dot { background:var(--err); border-color:var(--err); } .tl li.failed .dot::after { content:"\00d7"; font-size:12px; }
  .tl li.stopped .dot { background:var(--muted); border-color:var(--muted); } .tl li.stopped .dot::after { content:"\2013"; }
  .tl li.done::before { background:var(--ok); opacity:.45; }
  .tl .lb { flex:1; min-width:0; } .tl .tm { font-variant-numeric:tabular-nums; font-size:12px; white-space:nowrap; }
  .tl .tb { width:54px; height:4px; border-radius:99px; background:var(--soft); overflow:hidden; flex:none; } .tl .tb i { display:block; height:100%; background:var(--accent); border-radius:99px; opacity:.7; }
  @keyframes tlp { 0% { box-shadow:0 0 0 0 rgba(31,95,174,.5); } 100% { box-shadow:0 0 0 8px rgba(31,95,174,0); } }
  details.tld { margin:8px 0 2px; } details.tld > summary { cursor:pointer; font-weight:600; font-size:13px; color:var(--muted); padding:2px 0; }
  button.sm { padding:4px 11px; font-size:12px; }
  .cal.rng { top:calc(100% + 6px); left:0; width:252px; }
  .cal .p { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
  .cal .p button { background:var(--soft); border:1px solid var(--line); color:var(--text); border-radius:99px; padding:2px 9px; font-size:11px; font-weight:600; }
  .cal .g button.inr { background:var(--soft); border-radius:0; color:var(--accent); }
  .cal .hint { font-size:11px; color:var(--muted); margin-top:4px; min-height:15px; }
  #fdbtn { display:inline-flex; align-items:center; gap:6px; padding:7px 9px; font-weight:500; }
  .cal .f { display:flex; justify-content:space-between; margin-top:4px; padding-top:4px; border-top:1px solid var(--line); }
  .cal .f button { background:none; border:0; color:var(--accent); font-weight:600; font-size:12px; padding:3px 6px; }
  #toasts { position:fixed; top:8px; left:12px; right:12px; z-index:50; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  .toast { pointer-events:auto; display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; font-size:13px; font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,.18); border:1px solid var(--line); background:var(--ok-bg); color:var(--ok); cursor:pointer; }
  .toast.bad { background:var(--err-bg); color:var(--err); } .toast.neu { background:var(--soft); color:var(--muted); } .toast span { flex:1; } .toast i { font-style:normal; opacity:.7; }
  .bar { height:8px; background:var(--soft); border-radius:99px; overflow:hidden; margin:8px 0 4px; border:1px solid var(--line); }
  .bar > i { display:block; height:100%; background:var(--accent); transition:width .4s; }
  .msg { padding:8px 10px; border-radius:6px; margin:10px 0; font-size:13px; background:var(--wait-bg); color:var(--wait); }
  .msg.err { background:var(--err-bg); color:var(--err); } .msg.ok { background:var(--ok-bg); color:var(--ok); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .sk { background:linear-gradient(90deg,var(--soft) 25%,var(--line) 50%,var(--soft) 75%); background-size:200% 100%; animation:sk 1.2s linear infinite; border-radius:6px; }
  @keyframes sk { from { background-position:200% 0; } to { background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce) { .sk { animation:none; } }
  .card .chk { margin-right:2px; width:16px; height:16px; accent-color:var(--accent); }
  .card.sel { border-color:var(--accent); background:var(--soft); }
  .bar2 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 10px; }
  .bar2 .sp { flex:1; }
  .hide { display:none; }
  .ops { display:flex; gap:8px; flex-wrap:wrap; border-top:1px solid var(--line); margin-top:14px; padding-top:12px; }
  .ops { align-items:flex-start; }
  .ops .danger { margin-left:auto; }
  .actions.files { align-items:center; margin-top:4px; }
  .empty { text-align:center; padding:28px 12px; color:var(--muted); }
  .empty button { margin-top:10px; }
  .sub { margin-top:6px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:8px 0; font-size:13px; } dt { color:var(--muted); }
</style>
</head>
<body>
<div class="top"><h1>Generatore MDR</h1><button class="sec" id="zoom" type="button" title="Ingrandisci" aria-label="Ingrandisci"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button></div>
<div id="toasts"></div>
<div id="cfg"></div>
<div class="tabs">
  <button class="tab on" data-t="new">Nuova generazione</button>
  <button class="tab" data-t="list">Generazioni</button>
</div>

<section id="v-new">
  <label for="code">Codice progetto</label>
  <input type="text" id="code" maxlength="40" placeholder="es. 5890" autocomplete="off">
  <label for="nm">Nome della generazione (facoltativo)</label>
  <input type="text" id="nm" maxlength="60" placeholder="es. Progetto 8001 – revisione giugno" autocomplete="off">
  <label for="sd">Data di inizio progetto (facoltativa)</label>
  <div class="dp"><input type="text" id="sd" inputmode="numeric" maxlength="10" placeholder="gg/mm/aaaa" autocomplete="off" style="max-width:150px">
    <div class="cwrap"><button type="button" class="sec" id="sdbtn" title="Scegli dal calendario" aria-label="Scegli dal calendario"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 7h12M5 1.5v3M11 1.5v3"/></svg></button>
    <div id="cal" class="cal hide"></div></div></div>
  <div id="sdmsg" class="muted"></div>
  <label>Scope of Work (PDF)</label>
  <div class="drop" id="drop">Trascina qui i PDF oppure clicca per sceglierli<input type="file" id="file" accept="application/pdf,.pdf" multiple class="hide"></div>
  <ul class="files" id="files"></ul>
  <div id="tot" class="muted"></div>
  <div class="actions"><button id="go" disabled>Avvia generazione</button></div>
  <div id="hint" class="muted"></div>
  <div id="newmsg"></div>
</section>

<section id="v-list" class="hide">
  <div class="bar2">
    <button class="sec" id="refresh">Aggiorna</button>
    <button class="sec" id="selmode">Seleziona</button>
    <span class="sp"></span>
    <button class="sec hide" id="selall">Seleziona tutte</button>
    <button class="danger hide" id="delsel" disabled>Elimina</button>
  </div>
  <div class="bar2 filters">
    <input type="text" id="fq" maxlength="40" placeholder="Cerca codice o nome" aria-label="Cerca codice o nome" autocomplete="off">
    <select id="fs" aria-label="Filtra per stato">
      <option value="">Tutti gli stati</option><option value="active">In corso</option><option value="succeeded">Completati</option>
      <option value="failed">In errore</option><option value="cancelled">Annullati</option>
    </select>
    <select id="fo" aria-label="Ordina">
      <option value="new">Più recenti prima</option><option value="old">Meno recenti prima</option>
    </select>
    <div class="cwrap"><button type="button" class="sec" id="fdbtn" aria-label="Filtra per data" title="Filtra per data"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 7h12M5 1.5v3M11 1.5v3"/></svg><span id="fdlbl">Tutte le date</span></button><div id="rcal" class="cal rng hide"></div></div>
    <button class="sec hide" id="fclear">Azzera filtri</button>
  </div>
  <div id="list"></div>
  <div id="meta" class="muted" style="margin-top:8px"></div>
</section>

<section id="v-det" class="hide">
  <div class="crumb"><button class="lnkb" id="back" type="button"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Tutte le generazioni</button></div>
  <div id="det"></div>
</section>

<script>/*__MCP_APPS_SDK__*/</script>
<script>
(function () {
  var MAXF = 32, MAXT = 100;
  var files = [], busy = false, curJob = null, timer = null, seeded = false, seedUsed = false, cfgError = false;
  var $ = function (id) { return document.getElementById(id); };
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; }
  function mb(n) { return (n / 1048576).toFixed(1) + " MB"; }
  function parse(res) {
    if (res && res.structuredContent) return res.structuredContent;
    var t = ((res && res.content) || []).filter(function (c) { return c.type === "text"; }).map(function (c) { return c.text; }).join(" ");
    try { return JSON.parse(t); } catch (e) { return null; }
  }
  function errText(res) {
    var t = ((res && res.content) || []).map(function (c) { return c.text || ""; }).join(" ").trim();
    return t || "Operazione non riuscita.";
  }

  var sdk = window.__mcpApps;
  if (!sdk || !sdk.App) { document.body.textContent = "Il pannello non si è caricato correttamente."; return; }
  var app = new sdk.App({ name: "Generatore MDR", version: "1.0.0" }, {});
  function call(name, args) {
    return app.callServerTool({ name: name, arguments: args || {} }).then(function (res) {
      if (res && res.isError) throw new Error(errText(res));
      return parse(res) || {};
    });
  }
  var prevActive = {};
  function toast(r) {
    var ok = r.state === "succeeded", bad = r.state === "failed";
    var box = $("toasts"), n = el("div", "toast" + (bad ? " bad" : ok ? "" : " neu"));
    n.appendChild(el("span", "", (ok ? "Generazione completata" : bad ? "Generazione in errore" : "Generazione annullata") + " · Progetto " + r.project_code));
    n.appendChild(el("i", "", "Apri"));
    var close = function () { if (n.parentNode) n.parentNode.removeChild(n); };
    n.onclick = function () { close(); curJob = r.job_id; links = null; show("det"); };
    box.appendChild(n); if (!bad) setTimeout(close, 12000);
  }
  function note(text) { // avviso breve che sparisce da solo
    var box = $("toasts"), n = el("div", "toast"); n.appendChild(el("span", "", text));
    var close = function () { if (n.parentNode) n.parentNode.removeChild(n); };
    n.onclick = close; box.appendChild(n); setTimeout(close, 5000);
  }
  function track(list) { // avvisa quando una generazione che era in corso termina
    (list || []).forEach(function (r) {
      if (prevActive[r.job_id] && !r.active) toast(r);
      prevActive[r.job_id] = !!r.active;
    });
  }
  function say(box, text, kind) { box.textContent = ""; if (text) { var m = el("div", "msg " + (kind || ""), text); box.appendChild(m); } }

  // ---- schede
  function show(tab) {
    ["new", "list", "det"].forEach(function (t) { $("v-" + t).classList.toggle("hide", t !== tab); });
    document.querySelectorAll(".tab").forEach(function (b) { b.classList.toggle("on", b.dataset.t === (tab === "det" ? "list" : tab)); });
    clearTimeout(timer);
    if (tab !== "list") { selecting = false; picked = {}; clearTimeout(ltimer); }
    if (tab === "list") loadList(false);
    if (tab === "det") pollDet();
  }
  document.querySelectorAll(".tab").forEach(function (b) { b.onclick = function () { show(b.dataset.t); }; });

  // ---- nuova generazione
  function renderFiles() {
    var ul = $("files"); ul.textContent = "";
    files.forEach(function (f, i) {
      var li = el("li"); li.appendChild(el("span", "n", f.name));
      if (f.reuse) li.appendChild(el("span", "tag", "già caricato"));
      li.appendChild(el("span", "s", mb(f.size) + (f.pages ? " · " + f.pages + (f.pages === 1 ? " pagina" : " pagine") : "")));
      if (f.bad) { var bw = el("span", "s", "non è un PDF valido"); bw.style.color = "var(--err)"; li.appendChild(bw); }
      var pb = el("button", "sec ico", ""); pb.type = "button"; pb.innerHTML = EYE; pb.title = "Anteprima rapida"; pb.setAttribute("aria-label", "Anteprima di " + f.name);
      if (f.reuse) pb.onclick = function () { // file già nel bucket (da una generazione precedente): anteprima dal link firmato
        call("mdr_link", { job_id: f.reuse, tipo: "sow", nome: f.name }).then(function (l) {
          openPreview(f.name, function () { return fetch(l.url).then(function (res) { if (!res.ok) throw new Error("download " + res.status); return res.arrayBuffer(); }); }, l.url);
        }).catch(function (e) { say($("newmsg"), "Anteprima non disponibile: " + String((e && e.message) || e), "err"); });
      }; else pb.onclick = function () { openPreview(f.name, function () { return f.arrayBuffer ? f.arrayBuffer() : new Promise(function (ok, no) { var rd = new FileReader(); rd.onload = function () { ok(rd.result); }; rd.onerror = no; rd.readAsArrayBuffer(f); }); }, ""); };
      if (!f.bad) li.appendChild(pb);
      var x = el("button", "x", "×"); x.title = "Rimuovi"; x.onclick = function () { if (!busy) { files.splice(i, 1); renderFiles(); } };
      li.appendChild(x); ul.appendChild(li);
    });
    var tot = files.reduce(function (a, f) { return a + f.size; }, 0), code = $("code").value.trim();
    var known = files.length && files.every(function (f) { return f.pages; }), pg = files.reduce(function (a, f) { return a + (f.pages || 0); }, 0);
    $("tot").textContent = files.length ? files.length + " file · " + mb(tot) + " su " + MAXT + " MB" + (known ? " · " + pg + " pagine" : "") : "";
    $("go").disabled = cfgError || busy || !files.length || !code || files.some(function (f) { return f.bad; });
    $("hint").textContent = (cfgError || busy || (files.length && code)) ? "" :
      (!code && !files.length ? "Inserisci il codice progetto e carica almeno un PDF." : !code ? "Inserisci il codice progetto." : "Carica almeno un PDF.");
  }
  function readPages(f) { // numero di pagine e controllo che sia un PDF (alla meglio: alcuni PDF compressi non lo rivelano)
    if (f.pages !== undefined) return; f.pages = null;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var s = String(rd.result);

        while ((m = re.exec(s))) { c = /\/Count\s+(\d+)/.exec(m[0]); if (c && +c[1] > n) n = +c[1]; }
        if (!n) { var pm = s.match(/\/Type\s*\/Page(?![a-zA-Z])/g); n = pm ? pm.length : 0; }
        f.pages = n || null;

    };

    rd.readAsBinaryString(f);
  }
  function addFiles(list) {
    var msgs = [];
    Array.prototype.forEach.call(list, function (f) {
      if (!/\.pdf$/i.test(f.name)) { msgs.push("'" + f.name + "' non è un PDF."); return; }
      if (f.size > MAXF * 1048576) { msgs.push("'" + f.name + "' supera " + MAXF + " MB."); return; }
      if (files.some(function (g) { return g.name === f.name && g.size === f.size; })) return;
      files.push(f); readPages(f);
    });
    var tot = files.reduce(function (a, f) { return a + f.size; }, 0);
    if (tot > MAXT * 1048576) { msgs.push("Totale oltre " + MAXT + " MB."); }
    say($("newmsg"), msgs.join(" "), msgs.length ? "err" : "");
    renderFiles();
  }
  $("drop").onclick = function () { $("file").click(); };
  $("file").onchange = function () { addFiles(this.files); this.value = ""; };
  $("drop").ondragover = function (e) { e.preventDefault(); this.classList.add("over"); };
  $("drop").ondragleave = function () { this.classList.remove("over"); };
  $("drop").ondrop = function (e) { e.preventDefault(); this.classList.remove("over"); addFiles(e.dataTransfer.files); };
  var dupFor = "";
  $("code").oninput = function () { dupFor = ""; $("go").textContent = "Avvia generazione"; renderFiles(); };

  function put(url, file) {
    return fetch(url, { method: "PUT", headers: { "Content-Type": "application/pdf" }, body: file }).then(function (r) {
      if (!r.ok) throw new Error("Caricamento di '" + file.name + "' non riuscito (" + r.status + ").");
    });
  }
  function sdIso() { // gg/mm/aaaa -> aaaa-mm-gg ("" se vuota, null se non valida)
    var v = $("sd").value.trim(); if (!v) return "";
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v); if (!m) return null;
    var d = +m[1], mo = +m[2], y = +m[3], dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    return y + "-" + ("0" + mo).slice(-2) + "-" + ("0" + d).slice(-2);
  }
  $("sd").oninput = function () {
    var v = this.value.replace(/[^0-9\/]/g, "");
    if (/^\d{2}$|^\d{2}\/\d{2}$/.test(v) && (this._len || 0) < v.length) v += "/"; // aggiunge la barra mentre si scrive
    this._len = v.length; this.value = v;
    $("sdmsg").textContent = sdIso() === null && v.length >= 8 ? "Data non valida: usa gg/mm/aaaa (es. 15/03/2026)." : "";
  };
  // calendario (scritto a mano: il selettore nativo non è sempre disponibile dentro la chat)
  var calY = 0, calM = 0, MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  function pad2(n) { return ("0" + n).slice(-2); }
  function setSd(y, m, d) { $("sd").value = pad2(d) + "/" + pad2(m + 1) + "/" + y; $("sd")._len = 10; $("sdmsg").textContent = ""; $("cal").classList.add("hide"); }
  function drawCal() {
    var c = $("cal"); c.textContent = "";
    var h = el("div", "h"), pv = el("button", "", "‹"), nx = el("button", "", "›");
    pv.type = nx.type = "button"; pv.title = "Mese precedente"; nx.title = "Mese successivo";
    pv.onclick = function () { calM--; if (calM < 0) { calM = 11; calY--; } drawCal(); };
    nx.onclick = function () { calM++; if (calM > 11) { calM = 0; calY++; } drawCal(); };
    h.appendChild(pv); h.appendChild(el("b", "", MESI[calM] + " " + calY)); h.appendChild(nx); c.appendChild(h);
    var g = el("div", "g"); ["lun","mar","mer","gio","ven","sab","dom"].forEach(function (d) { g.appendChild(el("span", "w", d)); });
    var first = (new Date(calY, calM, 1).getDay() + 6) % 7; // sempre 6 settimane: l'altezza non cambia da un mese all'altro
    var cur = sdIso(), now = new Date(), todayIso = now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
    for (var i = 0; i < 42; i++) (function (i) {
      var dt = new Date(calY, calM, 1 - first + i), y = dt.getFullYear(), m = dt.getMonth(), d = dt.getDate();
      var iso = y + "-" + pad2(m + 1) + "-" + pad2(d), wd = i % 7;
      var cls = (m !== calM ? "out " : "") + (wd >= 5 ? "we " : "") + (iso === todayIso ? "today " : "") + (iso === cur ? "sel" : "");
      var b = el("button", cls.trim(), String(d)); b.type = "button";
      b.onclick = function () { setSd(y, m, d); };
      g.appendChild(b);
    })(i);
    c.appendChild(g);
    var f = el("div", "f"), tb = el("button", "", "Oggi"), cl = el("button", "", "Cancella"); tb.type = cl.type = "button";
    tb.onclick = function () { setSd(now.getFullYear(), now.getMonth(), now.getDate()); };
    cl.onclick = function () { $("sd").value = ""; $("sd")._len = 0; $("sdmsg").textContent = ""; $("cal").classList.add("hide"); };
    f.appendChild(tb); f.appendChild(cl); c.appendChild(f);
  }
  $("sdbtn").onclick = function (e) {
    e.stopPropagation();
    if (!$("cal").classList.contains("hide")) { $("cal").classList.add("hide"); return; }
    var iso = sdIso(), d = iso ? new Date(iso + "T00:00:00") : new Date();
    calY = d.getFullYear(); calM = d.getMonth(); $("cal").classList.toggle("below", document.documentElement.clientWidth < 500); drawCal(); $("cal").classList.remove("hide");
  };
  $("cal").onclick = function (e) { e.stopPropagation(); }; // i pulsanti del calendario vengono ridisegnati: il clic non deve chiuderlo
  document.addEventListener("click", function (e) { var c = $("cal"); if (!c.classList.contains("hide") && !c.contains(e.target) && e.target !== $("sd")) c.classList.add("hide"); });
  $("go").onclick = function () {
    if (busy) return;
    var sdv = sdIso(); if (sdv === null) { $("sdmsg").textContent = "Data non valida: usa gg/mm/aaaa (es. 15/03/2026)."; $("sd").focus(); return; }
    var code0 = $("code").value.trim();
    if (dupFor !== code0) { // prima di spendere crediti: c'è già una generazione per questo progetto?
      busy = true; renderFiles(); say($("newmsg"), "Controllo se esiste già una generazione…");
      call("mdr_esistenti", { project_code: code0 }).then(function (d) {
        busy = false; renderFiles(); dupFor = code0;
        var ex = (d && d.esistenti) || [];
        if (!ex.length) { say($("newmsg"), ""); $("go").onclick(); return; }
        var e0 = ex[0];
        say($("newmsg"), "Per il progetto " + code0 + " esiste già una generazione (" + (e0.state === "succeeded" ? "completata" : "in corso") + ", " + relLabel(e0.created_label) + (e0.name ? ", «" + e0.name + "»" : "") + (ex.length > 1 ? ", e altre " + (ex.length - 1) : "") + "). Se continui ne parte un'altra e consuma altri crediti dei modelli.");
        $("go").textContent = "Avvia comunque";
      }).catch(function () {
        busy = false; renderFiles(); dupFor = code0;
        say($("newmsg"), "Non sono riuscito a controllare se esiste già una generazione per il progetto " + code0 + ". Se continui ne parte una nuova e consuma crediti dei modelli.");
        $("go").textContent = "Avvia comunque";
      });
      return;
    }
    busy = true; renderFiles();
    var box = $("newmsg"), job = null;
    say(box, "Preparo il caricamento…");
    var fresh = files.filter(function (f) { return !f.reuse; }), old = files.filter(function (f) { return f.reuse; });
    call("mdr_prepara_upload", {
      project_code: $("code").value.trim(), start_date: sdv, name: $("nm").value.trim(),
      files: fresh.map(function (f) { return { name: f.name, size: f.size }; }),
      riuso_job: old.length ? old[0].reuse : "", riuso_files: old.map(function (f) { return f.name; })
    }).then(function (p) {
      job = p.job_id;
      var n = 0;
      return Promise.all(p.uploads.map(function (u, i) {
        return put(u.url, fresh[i]).then(function () { n++; say(box, "Caricati " + n + " di " + fresh.length + " PDF…"); });
      }));
    }).then(function () {
      say(box, "Avvio la generazione…");
      return call("mdr_avvia", { job_id: job });
    }).then(function (run) {
      files = []; busy = false; dupFor = ""; $("nm").value = ""; $("go").textContent = "Avvia generazione"; renderFiles(); say(box, "");
      runs[run.job_id] = run; if (cache) { cache.runs.unshift(run); cache.at = 0; }
      curJob = run.job_id; show("det");
    }).catch(function (e) {
      busy = false; renderFiles(); say(box, String(e.message || e), "err");
    });
  };

  // ---- elenco
  // "13/10/2026 16:22" (ora di Roma, già calcolata dal server) -> oggi/ieri, chiave di ordinamento, giorni trascorsi
  function parseLabel(l) { var m = /^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})$/.exec(l || ""); return m ? { d: +m[1], mo: +m[2], y: +m[3], h: m[4], mi: m[5] } : null; }
  function romeToday() { var p = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Rome", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()).split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5; }
  function ageDays(l) { var p = parseLabel(l); return p ? Math.round(romeToday() - Date.UTC(p.y, p.mo - 1, p.d) / 864e5) : null; }
  function relLabel(l) { var a = ageDays(l), p = parseLabel(l); if (a === 0) return "oggi " + p.h + ":" + p.mi; if (a === 1) return "ieri " + p.h + ":" + p.mi; return l || "-"; }
  function labelKey(l) { var p = parseLabel(l); return p ? ((p.y * 100 + p.mo) * 100 + p.d) * 10000 + (+p.h) * 100 + (+p.mi) : 0; }
  function badge(run) { return el("span", "st " + run.state, run.state_label); }
  function skel(w, h) { var d = el("div", "sk"); d.style.width = w; d.style.height = h; return d; }
  function skelList(box) {
    box.textContent = "";
    for (var i = 0; i < 4; i++) {
      var c = el("div", "card"), row = el("div", "row");
      row.appendChild(skel("45%", "16px")); row.appendChild(skel("70px", "20px")); c.appendChild(row);
      var m = skel("30%", "12px"); m.style.marginTop = "8px"; c.appendChild(m); box.appendChild(c);
    }
  }
  function skelDet(box) {
    box.textContent = "";
    var row = el("div", "row"); row.appendChild(skel("45%", "18px")); row.appendChild(skel("80px", "20px")); box.appendChild(row);
    var bar = skel("100%", "8px"); bar.style.margin = "10px 0"; box.appendChild(bar);
    for (var i = 0; i < 4; i++) { var l = skel(60 + i * 8 + "%", "12px"); l.style.marginBottom = "8px"; box.appendChild(l); }
    var act = el("div", "actions"); act.appendChild(skel("110px", "30px")); act.appendChild(skel("150px", "30px")); act.appendChild(skel("60px", "30px")); box.appendChild(act);
  }
  var rFrom = 0, rTo = 0, fdate = "", forder = "new", runs = {}, currentRuns = [], currentMore = false, fq = "", fs = "", flimit = 10, loadTok = 0;
  var selecting = false, picked = {};
  function pickedIds() { return Object.keys(picked).filter(function (k) { return picked[k]; }); }
  function updateSel() {
    var n = pickedIds().length, btn = $("delsel");
    btn.disabled = n === 0; btn.textContent = n ? "Elimina (" + n + ")" : "Elimina";
    delete btn.dataset.sure; btn.className = "danger" + (selecting ? "" : " hide");
    $("selmode").textContent = selecting ? "Annulla" : "Seleziona";
    $("selall").classList.toggle("hide", !selecting);
    btn.classList.toggle("hide", !selecting);
    document.querySelectorAll("#list .card").forEach(function (c) {
      var on = !!picked[c.dataset.job]; c.classList.toggle("sel", on);
      var k = c.querySelector(".chk"); if (k) k.checked = on;
    });
  }
  function sumText(r) {
    var s = r.summary || {}, p = [];
    if (s["Righe MDR"] != null) p.push(s["Righe MDR"] + " righe");
    if (s["Documenti"] != null) p.push(s["Documenti"] + " documenti");
    if (s["Durata (minuti)"] != null) p.push(Math.round(s["Durata (minuti)"]) + " min");
    return p.join(" · ");
  }
  function tabCount() {
    var n = cache ? cache.runs.filter(function (r) { return r.active; }).length : 0;
    document.querySelector('.tab[data-t="list"]').textContent = "Generazioni" + (n ? " · " + n + " in corso" : "");
  }
  function renderList(d) {
    currentRuns = d.runs; currentMore = d.altri;
    var box = $("list"); box.textContent = "";
    if (!d.runs.length) {
      var em = el("div", "empty"), filt = !!(fq || fs || fdate);
      em.appendChild(el("div", "", filt ? "Nessuna generazione corrisponde ai filtri." : "Non c'è ancora nessuna generazione."));
      var eb = el("button", "sec", filt ? "Azzera filtri" : "Nuova generazione");
      eb.onclick = function () { if (filt) $("fclear").onclick(); else show("new"); };
      em.appendChild(eb); box.appendChild(em); updateSel(); return;
    }
    d.runs.forEach(function (r) {
      runs[r.job_id] = r;
      var c = el("div", "card click"), row = el("div", "row"); c.dataset.job = r.job_id;
      if (selecting) {
        var k = el("input", "chk"); k.type = "checkbox"; k.disabled = r.active; k.title = r.active ? "In corso: annullala prima" : "";
        k.onclick = function (e) { e.stopPropagation(); picked[r.job_id] = k.checked; updateSel(); };
        row.appendChild(k);
      }
      row.appendChild(el("span", "name", r.name || "Progetto " + r.project_code)); row.appendChild(badge(r)); c.appendChild(row);
      c.appendChild(el("div", "muted", (r.name ? "Progetto " + r.project_code + " · " : "") + relLabel(r.created_label) + (r.active ? " · " + (r.step_label || "") : "")));
      if (r.active) { var pb = el("div", "bar"), pi = el("i"); pi.style.width = r.progress + "%"; pb.appendChild(pi); c.appendChild(pb); }
      else if (r.state === "succeeded" && sumText(r)) c.appendChild(el("div", "muted sub", sumText(r)));
      c.onclick = function () {
        if (selecting) { if (!r.active) { picked[r.job_id] = !picked[r.job_id]; updateSel(); } return; }
        curJob = r.job_id; show("det");
      };
      box.appendChild(c);
    });
    if (d.altri) {
      var more = el("button", "sec", flimit >= 50 ? "Ce ne sono altre: affina i filtri" : "Mostra altre"); more.disabled = flimit >= 50;
      more.onclick = function () { flimit = Math.min(flimit + 10, 50); drawList(); };
      box.appendChild(more);
    }
    updateSel();
